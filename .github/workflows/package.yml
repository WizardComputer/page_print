name: Package

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
  pull_request:
    paths:
      - ".github/workflows/package.yml"
      - "Gemfile"
      - "Gemfile.lock"
      - "Rakefile"
      - "ext/page_print/**"
      - "lib/page_print.rb"
      - "lib/page_print/**"
      - "page_print.gemspec"
      - "rakelib/package_*.rake"

jobs:
  source:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4.7"
          bundler-cache: true

      - name: Build source gem
        run: gem build page_print.gemspec

      - uses: actions/upload-artifact@v4
        with:
          name: page_print-source-gem
          path: page_print-*.gem

  linux:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build native Linux gem
        run: |
          docker run --rm -v "$PWD:/work" -w /work ruby:3.2-bullseye bash -lc '
            apt-get update && apt-get install -y --no-install-recommends \
              build-essential \
              ca-certificates \
              git \
              pkg-config \
              ninja-build \
              patchelf \
              python3-pip \
              xz-utils \
              libcairo2-dev \
              libexpat1-dev \
              libicu-dev \
              libfreetype6-dev \
              libfontconfig1-dev \
              libharfbuzz-dev && \
            rm -rf /var/lib/apt/lists/* && \
            python3 -m pip install meson==1.3.2 && \
            gem install bundler:2.4.22 && \
            bundle install && \
            bundle exec rake package:linux
          '

      - name: Verify Linux gem compiles extension on install
        run: |
          docker run --rm -v "$PWD/pkg:/pkg" ruby:3.2-slim ruby -rrubygems/package -e 'gem_path = Dir["/pkg/page_print-*-x86_64-linux.gem"].fetch(0); spec = Gem::Package.new(gem_path).spec; abort "Linux gem must not include precompiled Ruby extension" if spec.files.any? { |file| file == "lib/page_print/page_print.so" }'

      - name: Smoke test native Linux gem in clean Ruby image
        run: |
          docker run --rm -v "$PWD/pkg:/pkg" ruby:3.2-slim bash -lc 'apt-get update && apt-get install -y --no-install-recommends build-essential && gem install /pkg/page_print-*-x86_64-linux.gem || { find /usr/local/bundle/extensions -name mkmf.log -print -exec cat {} \;; exit 1; }; ruby -e "require \"page_print\"; pdf = PagePrint.render(\"<html><body><h1>Hello</h1></body></html>\"); abort \"bad pdf\" unless pdf.start_with?(\"%PDF\"); puts \"ok\""'
          docker run --rm -v "$PWD/pkg:/pkg" ruby:3.4.7-slim bash -lc 'apt-get update && apt-get install -y --no-install-recommends build-essential && gem install /pkg/page_print-*-x86_64-linux.gem || { find /usr/local/bundle/extensions -name mkmf.log -print -exec cat {} \;; exit 1; }; ruby -e "require \"page_print\"; pdf = PagePrint.render(\"<html><body><h1>Hello</h1></body></html>\"); abort \"bad pdf\" unless pdf.start_with?(\"%PDF\"); puts \"ok\""'
          docker run --rm -v "$PWD/pkg:/pkg" ruby:4.0-slim bash -lc 'apt-get update && apt-get install -y --no-install-recommends build-essential && gem install /pkg/page_print-*-x86_64-linux.gem || { find /usr/local/bundle/extensions -name mkmf.log -print -exec cat {} \;; exit 1; }; ruby -e "require \"page_print\"; pdf = PagePrint.render(\"<html><body><h1>Hello</h1></body></html>\"); abort \"bad pdf\" unless pdf.start_with?(\"%PDF\"); puts \"ok\""'

      - uses: actions/upload-artifact@v4
        with:
          name: page_print-linux-gem
          path: pkg/page_print-*-x86_64-linux.gem

  darwin-arm64:
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4.7"
          bundler-cache: true

      - name: Install PlutoBook build dependencies
        run: |
          brew update
          brew install meson ninja pkg-config cairo freetype harfbuzz fontconfig expat icu4c

      - name: Configure Homebrew pkg-config paths
        run: echo "PKG_CONFIG_PATH=$(brew --prefix icu4c)/lib/pkgconfig:$PKG_CONFIG_PATH" >> "$GITHUB_ENV"

      - name: Build native Apple Silicon macOS gem
        run: bundle exec rake package:darwin_arm64

      - name: Verify macOS gem compiles extension on install
        run: |
          ruby -rrubygems/package -e 'gem_path = Dir["pkg/page_print-*-arm64-darwin.gem"].fetch(0); spec = Gem::Package.new(gem_path).spec; abort "macOS gem must not include precompiled Ruby extension" if spec.files.any? { |file| file == "lib/page_print/page_print.bundle" }'

      - name: Smoke test native Apple Silicon macOS gem
        run: |
          gem install pkg/page_print-*-arm64-darwin.gem
          ruby -e 'require "page_print"; pdf = PagePrint.render("<html><body><h1>Hello</h1></body></html>"); abort "bad pdf" unless pdf.start_with?("%PDF"); puts "ok"'

      - uses: actions/upload-artifact@v4
        with:
          name: page_print-darwin-arm64-gem
          path: pkg/page_print-*-arm64-darwin.gem

  publish:
    name: Publish
    needs: [source, linux, darwin-arm64]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4.7"

      - uses: actions/download-artifact@v4
        with:
          path: gems
          pattern: page_print-*-gem
          merge-multiple: true

      - name: Expect exact gem artifacts for tag version
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          expected=(
            "page_print-${version}.gem"
            "page_print-${version}-x86_64-linux.gem"
            "page_print-${version}-arm64-darwin.gem"
          )

          # download-artifact may nest files; flatten expected gems to gems/
          mkdir -p gems
          for name in "${expected[@]}"; do
            if [[ ! -f "gems/${name}" ]]; then
              match="$(find gems -type f -name "${name}" | head -n 1 || true)"
              [[ -n "${match}" ]] || { echo "Missing expected gem artifact: ${name}" >&2; exit 1; }
              mv "${match}" "gems/${name}"
            fi
          done

          mapfile -t found < <(find gems -type f -name 'page_print-*.gem' -printf '%f\n' | sort)
          printf 'Found gems:\n'
          printf '  %s\n' "${found[@]}"

          missing=()
          for name in "${expected[@]}"; do
            [[ -f "gems/${name}" ]] || missing+=("${name}")
          done
          unexpected=()
          for base in "${found[@]}"; do
            keep=false
            for name in "${expected[@]}"; do
              [[ "${base}" == "${name}" ]] && keep=true && break
            done
            [[ "${keep}" == true ]] || unexpected+=("${base}")
          done

          if ((${#missing[@]})); then
            echo "Missing expected gem artifacts: ${missing[*]}" >&2
            exit 1
          fi
          if ((${#unexpected[@]})); then
            echo "Unexpected gem artifacts: ${unexpected[*]}" >&2
            exit 1
          fi

      - uses: rubygems/configure-rubygems-credentials@v2.1.0

      - name: Push gems to RubyGems
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          already_published() {
            printf '%s' "$1" | grep -Eqi 'repushing of gem versions is not allowed|already (exists|been pushed|published)'
          }

          for name in \
            "page_print-${version}.gem" \
            "page_print-${version}-x86_64-linux.gem" \
            "page_print-${version}-arm64-darwin.gem"
          do
            echo "Pushing ${name}"
            set +e
            output="$(gem push "gems/${name}" 2>&1)"
            status=$?
            set -e
            printf '%s\n' "${output}"
            if [[ "${status}" -eq 0 ]]; then
              continue
            fi
            if already_published "${output}"; then
              echo "${name} is already published, skipping"
              continue
            fi
            echo "Failed to publish ${name}" >&2
            exit 1
          done

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          tag="${GITHUB_REF_NAME}"

          prev="$(git tag -l 'v*' --sort=-v:refname | awk -v current="${tag}" '$0 != current { print; exit }')"
          if [[ -n "${prev}" ]]; then
            notes="$(git log "${prev}..${tag}" --oneline)"
            [[ -n "${notes}" ]] || notes="No commits since ${prev}."
          else
            notes="Initial release."
          fi

          assets=(
            "gems/page_print-${version}.gem"
            "gems/page_print-${version}-x86_64-linux.gem"
            "gems/page_print-${version}-arm64-darwin.gem"
          )

          if gh release view "${tag}" >/dev/null 2>&1; then
            echo "Release ${tag} already exists; refreshing assets"
            gh release upload "${tag}" "${assets[@]}" --clobber
          else
            gh release create "${tag}" --title "${tag}" --notes "${notes}" "${assets[@]}"
          fi
