name: Package

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  source:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4.7"
          bundler-cache: true

      - name: Build source gem
        run: gem build page_print.gemspec

      - uses: actions/upload-artifact@v4
        with:
          name: page_print-source-gem
          path: page_print-*.gem

  linux:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build native Linux gem
        run: |
          docker run --rm -v "$PWD:/work" -w /work ruby:3.0-bullseye bash -lc '
            apt-get update && apt-get install -y --no-install-recommends \
              build-essential \
              git \
              pkg-config \
              meson \
              ninja-build \
              patchelf \
              libcairo2-dev \
              libexpat1-dev \
              libicu-dev \
              libfreetype6-dev \
              libfontconfig1-dev \
              libharfbuzz-dev && \
            rm -rf /var/lib/apt/lists/* && \
            gem install bundler:2.4.22 && \
            bundle install && \
            bundle exec rake package:linux
          '

      - name: Verify Linux gem compiles extension on install
        run: |
          docker run --rm -v "$PWD/pkg:/pkg" ruby:3.0-slim ruby -rrubygems/package -e 'gem_path = Dir["/pkg/page_print-*-x86_64-linux.gem"].fetch(0); spec = Gem::Package.new(gem_path).spec; abort "Linux gem must not include precompiled Ruby extension" if spec.files.any? { |file| file == "lib/page_print/page_print.so" }'

      - name: Smoke test native Linux gem in clean Ruby image
        run: |
          docker run --rm -v "$PWD/pkg:/pkg" ruby:3.0-slim bash -lc 'apt-get update && apt-get install -y --no-install-recommends build-essential && gem install /pkg/page_print-*-x86_64-linux.gem || { find /usr/local/bundle/extensions -name mkmf.log -print -exec cat {} \;; exit 1; }; ruby -e "require \"page_print\"; pdf = PagePrint.html_to_pdf_string(\"<html><body><h1>Hello</h1></body></html>\"); abort \"bad pdf\" unless pdf.start_with?(\"%PDF\"); puts \"ok\""'
          docker run --rm -v "$PWD/pkg:/pkg" ruby:3.4.7-slim bash -lc 'apt-get update && apt-get install -y --no-install-recommends build-essential && gem install /pkg/page_print-*-x86_64-linux.gem || { find /usr/local/bundle/extensions -name mkmf.log -print -exec cat {} \;; exit 1; }; ruby -e "require \"page_print\"; pdf = PagePrint.html_to_pdf_string(\"<html><body><h1>Hello</h1></body></html>\"); abort \"bad pdf\" unless pdf.start_with?(\"%PDF\"); puts \"ok\""'

      - uses: actions/upload-artifact@v4
        with:
          name: page_print-linux-gem
          path: pkg/page_print-*-x86_64-linux.gem

  darwin-arm64:
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4.7"
          bundler-cache: true

      - name: Install PlutoBook build dependencies
        run: |
          brew update
          brew install meson ninja pkg-config cairo freetype harfbuzz fontconfig expat icu4c

      - name: Configure Homebrew pkg-config paths
        run: echo "PKG_CONFIG_PATH=$(brew --prefix icu4c)/lib/pkgconfig:$PKG_CONFIG_PATH" >> "$GITHUB_ENV"

      - name: Build native Apple Silicon macOS gem
        run: bundle exec rake package:darwin_arm64

      - name: Verify macOS gem compiles extension on install
        run: |
          ruby -rrubygems/package -e 'gem_path = Dir["pkg/page_print-*-arm64-darwin.gem"].fetch(0); spec = Gem::Package.new(gem_path).spec; abort "macOS gem must not include precompiled Ruby extension" if spec.files.any? { |file| file == "lib/page_print/page_print.bundle" }'

      - name: Smoke test native Apple Silicon macOS gem
        run: |
          gem install pkg/page_print-*-arm64-darwin.gem
          ruby -e 'require "page_print"; pdf = PagePrint.html_to_pdf_string("<html><body><h1>Hello</h1></body></html>"); abort "bad pdf" unless pdf.start_with?("%PDF"); puts "ok"'

      - uses: actions/upload-artifact@v4
        with:
          name: page_print-darwin-arm64-gem
          path: pkg/page_print-*-arm64-darwin.gem
